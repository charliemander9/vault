<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault</title>
<meta name="apple-mobile-web-app-title" content="vault.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="More value from every card. Know which card to use and never miss a credit.">
<meta name="theme-color" content="#F6F4EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm mobile column (max 34rem). Flat surfaces, hairline borders, one forest-green accent. */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFECE6; --ink:#24251F; --ink-2:#3A3B35; --muted:#6F7069;
  --line:#E3DFD6; --line-2:#D6D1C6; --brand:#2B3D33; --brand-text:#2B3D33; --accent:#2E5B45; --accent-ink:#FFFFFF; --accent-soft:#E4ECE6; --accent-text:#2E5B45;
  --good:#2E6B4B; --good-soft:#E1EEE5; --warn:#8C6216; --warn-soft:#F5ECDA; --bad:#A23B2E; --bad-soft:#F6E2DE;
  --shadow:0 1px 2px rgba(36,37,31,.04), 0 6px 18px -12px rgba(36,37,31,.18);
  --font:"Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131412; --surface:#1B1C19; --surface-2:#242520; --ink:#ECEAE3; --ink-2:#D6D4CC; --muted:#9A9990;
  --line:#2C2D28; --line-2:#3A3B35; --brand:#2F4A3B; --brand-text:#D8E6DC; --accent:#7DB192; --accent-ink:#0F1A13; --accent-soft:#1D2A22; --accent-text:#93C3A6;
  --good:#7DB192; --good-soft:#1D2A22; --warn:#D9A957; --warn-soft:#2E2617; --bad:#E07A6C; --bad-soft:#3A201C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131412; --surface:#1B1C19; --surface-2:#242520; --ink:#ECEAE3; --ink-2:#D6D4CC; --muted:#9A9990;
  --line:#2C2D28; --line-2:#3A3B35; --brand:#2F4A3B; --brand-text:#D8E6DC; --accent:#7DB192; --accent-ink:#0F1A13; --accent-soft:#1D2A22; --accent-text:#93C3A6;
  --good:#7DB192; --good-soft:#1D2A22; --warn:#D9A957; --warn-soft:#2E2617; --bad:#E07A6C; --bad-soft:#3A201C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg); color:var(--ink)}
body{font-family:var(--font); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; letter-spacing:-.005em}
button,input,select,textarea{font:inherit; color:inherit; letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
.wrap{max-width:34rem; margin:0 auto; padding-inline:20px; padding-block:16px 116px}

h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.02em}
.h1{font-size:1.75rem; line-height:1.15}
.h2{font-size:1.2rem; line-height:1.25}
.h3{font-size:1rem}
.sec{font-size:.8rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 10px}
.eyebrow{font-size:.75rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600}
.subhead{font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex; flex-direction:column; gap:12px}
.stack-lg{display:flex; flex-direction:column; gap:26px}
.row-flex{display:flex; align-items:center; gap:10px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:12px}
.grow{flex:1; min-width:0}
.lede{margin:0; color:var(--muted)} .lede b{color:var(--ink); font-size:1.4rem; font-weight:600; letter-spacing:-.02em}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:1.15rem; letter-spacing:-.03em; color:var(--brand-text)}
.brand-mark{width:28px; height:28px; border-radius:8px; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:.8rem; font-weight:700}
.icon-btn{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; color:var(--ink)}
.back{display:inline-flex; align-items:center; gap:4px; border:0; background:none; padding:8px 0; font-weight:500; color:var(--ink)}

/* buttons */
.btn{border:1px solid var(--line-2); background:var(--surface); border-radius:12px; padding:10px 16px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn-primary,.btn-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-primary:hover,.btn-accent:hover{border-color:var(--accent); filter:brightness(1.06)}
.btn-ghost{background:transparent}
.btn-small{min-height:36px; padding:7px 14px; font-size:.9rem; border-radius:10px}
.btn-block{width:100%}
.btn-danger{color:var(--bad)}
.btn:disabled{opacity:.4; cursor:default; filter:none}
.link{background:none; border:0; padding:0; color:var(--accent-text); font-weight:600; text-decoration:none}
.link:hover{text-decoration:underline; text-underline-offset:3px}

/* surfaces */
.list,.card-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg)}
.list{overflow:hidden}
.card-box{padding:4px 16px}
.note{background:var(--surface-2); border-radius:var(--r-md); padding:12px 14px; font-size:.92rem}
.empty{padding:22px 18px; text-align:center; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r-pill); padding:7px 14px; font-size:.9rem; font-weight:500; text-align:left}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.pill{font-size:.75rem; font-weight:600; padding:3px 9px; border-radius:var(--r-pill); background:var(--surface-2); color:var(--muted); white-space:nowrap}
.pill.hot{background:var(--warn-soft); color:var(--warn)}
.pill.warm{background:var(--accent-soft); color:var(--accent-text)}
.pill.done{background:var(--good-soft); color:var(--good)}
.flag{display:inline-flex; align-items:center; font-size:.75rem; font-weight:600; padding:2px 8px; border-radius:var(--r-pill); background:var(--warn-soft); color:var(--warn)}
.meter{height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden}
.meter > i{display:block; height:100%; background:var(--accent); border-radius:6px}

/* home */
.home{display:flex; flex-direction:column; gap:14px; padding-top:min(6vh, 44px)}
.hello{margin:0; font-weight:500; color:var(--muted); display:flex; align-items:center; gap:8px}
.ask{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:22px 18px 18px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow)}
.ask-q{font-size:1.85rem; line-height:1.12; font-weight:600; letter-spacing:-.03em}
.ask-form{display:flex; gap:8px; background:var(--bg); border:1px solid var(--line-2); border-radius:14px; padding:5px 5px 5px 16px; align-items:center}
.ask-form:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.ask-form input{flex:1; min-width:0; border:0; background:transparent; outline:none; font-size:1rem; padding:9px 0}
.ask-form input::placeholder{color:var(--muted)}
.ask-go{width:42px; height:42px; border-radius:10px; border:0; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; flex:none}
.qmenu{position:relative}
.qmenu-btn{width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px solid var(--line); background:transparent; border-radius:12px; padding:11px 14px; font-weight:500; color:var(--muted)}
.qmenu-btn:hover{border-color:var(--line-2); color:var(--ink)}
.qmenu-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.qmenu-list{position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--line-2); border-radius:16px; padding:6px; z-index:15; box-shadow:0 18px 40px -18px rgba(0,0,0,.35); display:flex; flex-direction:column; max-height:min(292px, 46vh); overflow-y:auto; overscroll-behavior:contain; -webkit-mask-image:linear-gradient(#000 86%, transparent); mask-image:linear-gradient(#000 86%, transparent)}
.qmenu-list[hidden]{display:none}
.qmenu-list button{border:0; background:transparent; text-align:left; padding:11px 12px; border-radius:10px; font-weight:500}
.qmenu-list button:hover{background:var(--surface-2)}
.qmenu-list button:last-child{margin-bottom:22px}
.chev{transition:transform .15s; flex:none}
.row-link{display:flex; align-items:center; gap:12px; width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-md); padding:13px 16px; text-align:left; color:var(--ink); font-weight:500}
.row-link:hover{border-color:var(--line-2)}
.row-link.subtle{background:transparent}
.row-link svg:first-child{color:var(--accent-text)}
.due{display:flex; align-items:center; gap:10px; border:1px solid transparent; background:var(--warn-soft); color:var(--ink); border-radius:var(--r-md); padding:12px 14px; text-align:left; font-size:.94rem; width:100%}
.due svg:first-child{color:var(--warn); flex:none}
.due.static{cursor:default}

/* answer */
.answer{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-lg); padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); animation:fadein .2s ease-out}
.answer:focus{outline:none}
.pick{display:flex; gap:14px; align-items:flex-start}
.pick-name{font-size:1.25rem; font-weight:600; letter-spacing:-.02em; line-height:1.2}
.pick-why{margin:4px 0 0; color:var(--ink-2)}
.answer-line{margin:0; font-size:.94rem; color:var(--ink-2)}
.answer-line.heads{color:var(--muted)} .answer-line.heads b{color:var(--ink)}
.answer-line.upsell{background:var(--accent-soft); border-radius:var(--r-sm); padding:10px 12px; color:var(--ink)}
.answer-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:2px}
.why{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; font-size:.93rem}
.why li{padding-left:16px; position:relative}
.why li::before{content:""; position:absolute; left:2px; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--muted)}
.alt-row{display:block; padding:6px 0; font-size:.92rem}
.src{font-size:.82rem; color:var(--muted); margin:0}
details > summary{list-style:none; cursor:pointer}
details > summary::-webkit-details-marker{display:none}
details[open] > summary .chev{transform:rotate(180deg)}
.more{border-top:1px solid var(--line); padding-top:10px}
.more > summary,.done-d > summary{display:flex; align-items:center; gap:6px; font-weight:500; font-size:.9rem; color:var(--muted)}

/* card art (original, flat) */
.ccard{position:relative; aspect-ratio:1.586; border-radius:16px; padding:16px 18px; color:#fff; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; border:0; text-align:left; max-width:100%; box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 12px 26px -16px rgba(0,0,0,.55)}
.ccard .stamp{display:none}
.ccard .issuer{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; font-weight:600; opacity:.8; position:relative; z-index:1}
.ccard .cname{font-weight:600; font-size:1.2rem; letter-spacing:-.01em; line-height:1.1; position:relative; z-index:1}
.ccard .net{font-size:.7rem; font-weight:600; letter-spacing:.06em; opacity:.75}
.ccard .chipart{width:30px; height:22px; border-radius:5px; background:rgba(255,255,255,.28); border:1px solid rgba(255,255,255,.35); position:relative; z-index:1}
.c-gold{background:#B39561; color:#211A0D}
.c-plat{background:#BFC0BB; color:#1E1F1C}
.c-csr{background:#1E2A43}
.c-bilt{background:#38393B}
.c-gold .chipart,.c-plat .chipart{background:rgba(0,0,0,.1); border-color:rgba(0,0,0,.14)}
.mini{display:inline-block; width:28px; height:18px; border-radius:4px; flex:none; position:relative; vertical-align:middle}
.mini::after{content:""; position:absolute; left:4px; top:5px; width:7px; height:5px; border-radius:1.5px; background:rgba(255,255,255,.45)}
.mini.c-gold::after,.mini.c-plat::after{background:rgba(0,0,0,.14)}
.mini.big{width:48px; height:31px; border-radius:6px; margin-top:2px}
.mini.big::after{left:7px; top:8px; width:11px; height:8px; border-radius:2px}
.carousel{position:relative; display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 2px 10px; scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .ccard{flex:0 0 min(76%, 290px); scroll-snap-align:center; transition:opacity .2s; opacity:.45}
.carousel .ccard.sel{opacity:1}

/* onboarding */
.pick-cards{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pick-card{border:0; padding:0; background:transparent; position:relative; border-radius:16px}
.pick-card .ccard{width:100%; outline:2px solid transparent; outline-offset:3px; transition:outline-color .15s}
.pick-card.on .ccard{outline-color:var(--accent)}
.pick-card .ccard .cname{font-size:.98rem}
.pick-card .tick{position:absolute; right:10px; bottom:10px; width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; z-index:2; opacity:0; transition:opacity .15s}
.pick-card.on .tick{opacity:1}
@media (max-width:380px){ .pick-cards{grid-template-columns:1fr} }

/* toggles + rows */
.toggle{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-inline:-20px; padding-inline:20px}
.toggle::-webkit-scrollbar{display:none}
.tg{flex:none; display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r-pill); padding:6px 14px 6px 7px; font-weight:500; font-size:.92rem}
.tg.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.item{display:flex; align-items:center; gap:0; border:0; border-top:1px solid var(--line); background:transparent; width:100%; text-align:left; padding:0}
.list > .item:first-child{border-top:0}
.item.pad{padding:13px 16px; gap:12px}
.item-title{display:block; font-weight:500}
.item-sub{display:block; font-size:.86rem; color:var(--muted); margin-top:1px}
.check-btn{border:0; background:transparent; padding:12px 10px 12px 16px; display:grid; place-items:center}
.item-main{flex:1; min-width:0; display:flex; align-items:center; gap:10px; border:0; background:transparent; text-align:left; padding:13px 16px 13px 2px}
.check{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line-2); display:grid; place-items:center; background:transparent}
.check-btn:hover .check{border-color:var(--accent)}
.check.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.check.on svg{width:13px; height:13px}
.check.part{border-color:var(--accent); background:conic-gradient(var(--accent) var(--p), transparent 0)}
.check.na{border-style:dashed}
.dot{width:10px; height:10px; border-radius:50%; flex:none}

/* benefits */
.facts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.fact{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px; display:flex; flex-direction:column; gap:3px; min-width:0}
.fact span{font-size:.78rem; color:var(--muted); font-weight:500}
.fact b{font-size:1.15rem; font-weight:600; letter-spacing:-.02em}
.fact b.accent{color:var(--accent-text)}
.earn{display:flex; gap:12px; align-items:baseline; padding:11px 0; border-top:1px solid var(--line)}
.earn:first-child{border-top:0}
.earn .x{font-weight:600; font-size:1.05rem; min-width:2.8rem; color:var(--accent-text)}
.perk{display:flex; gap:10px; padding:11px 0; border-top:1px solid var(--line)}
.perk:first-child{border-top:0}
.perk-d{border-top:1px solid var(--line)}
.perk-d:first-child{border-top:0}
.perk-d > summary{display:flex; align-items:center; gap:10px; padding:13px 0}
.perk-d > summary b{font-weight:500}
.perk-d .chev{color:var(--muted)}
.perk-body{padding:0 0 14px}
.perk-body p{margin:0 0 6px; color:var(--muted); font-size:.94rem}
.bonus{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; display:flex; flex-direction:column; gap:10px}
.card-row{background:var(--surface); border:1px solid var(--line) !important; border-radius:var(--r-md)}
.card-row input{width:20px; height:20px; accent-color:var(--accent)}

/* explore */
.rec{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:18px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow)}
.rec-art{width:min(100%, 280px)}
.rec .fact{background:var(--bg)}

/* forms */
.seg{display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface-2); border-radius:12px; padding:3px; gap:3px}
.seg button{border:0; background:transparent; border-radius:9px; padding:9px 4px; font-weight:500; font-size:.9rem; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-weight:500; font-size:.9rem}
.input{border:1px solid var(--line-2); background:var(--surface); border-radius:12px; padding:11px 14px; width:100%; min-width:0}
.input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.money{display:flex; align-items:center; gap:6px; border:1px solid var(--line-2); background:var(--surface); border-radius:12px; padding:0 14px}
.money:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.money input{border:0; background:transparent; outline:none; padding:11px 0; width:100%; min-width:0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:420px){ .grid2{grid-template-columns:1fr} }
textarea.input{min-height:140px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.8rem}

/* tab bar */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:34rem; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.tab{border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 11px; font-size:.72rem; font-weight:500; color:var(--muted)}
.tab svg{width:22px; height:22px}
.tab.on{color:var(--accent-text)}
.tab-ic{display:grid; place-items:center; padding:2px}

/* sheet */
.scrim{position:fixed; inset:0; background:rgba(18,18,15,.4); z-index:40; display:flex; align-items:flex-end; justify-content:center; animation:fadein .15s}
.sheet{background:var(--bg); width:100%; max-width:34rem; max-height:92%; overflow-y:auto; border-radius:22px 22px 0 0; padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px)); animation:up .22s ease-out}
.grab{width:36px; height:4px; border-radius:4px; background:var(--line-2); margin:4px auto 14px}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:22px; max-height:88%} }
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:500; font-size:.92rem; z-index:60; box-shadow:var(--shadow); max-width:calc(100% - 32px); animation:fadein .15s}
/* ---- v6 */
.launch{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding-block:18px 6px}
.launch-mark{width:84px; height:84px; border-radius:22px; background:var(--brand); color:#fff; display:grid; place-items:center}
.launch-name{font-size:2rem; font-weight:700; letter-spacing:-.04em; color:var(--brand-text); line-height:1}
/* ---- v5 additions */

/* ---------- 3. PERIODS --------------------------------------------------- */
const DAY = 86400000;
const now = () => { const d = window.__KEPT_NOW ? new Date(window.__KEPT_NOW) : new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + (ui.offsetDays || 0)); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { if (!s) return null; const [y,m,d] = s.split("-").map(Number); return y ? new Date(y, m-1, d||1) : null; };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDate = (d, yr) => d.toLocaleDateString("en-US", yr ? {month:"short", day:"numeric", year:"numeric"} : {month:"short", day:"numeric"});
const money = n => { const r = Math.round(n*100)/100; return "$" + (Number.isInteger(r) ? r.toLocaleString("en-US") : r.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2})); };
const daysUntil = (end, t) => Math.round((end - t)/DAY);

function periodOf(b, inst, t){
  const y = t.getFullYear(), m = t.getMonth();
  let start, end, key, label, assumed = false;
  if (b.frequency === "monthly"){ start = new Date(y,m,1); end = new Date(y,m+1,0); key = `${y}-M${String(m+1).padStart(2,"0")}`; label = MONTHS[m]; }
  else if (b.frequency === "quarterly"){ const q = Math.floor(m/3); start = new Date(y,q*3,1); end = new Date(y,q*3+3,0); key = `${y}-Q${q+1}`; label = `Q${q+1} ${y}`; }
  else if (b.frequency === "semiannual"){ const h = m < 6 ? 0 : 1; start = new Date(y,h*6,1); end = new Date(y,h*6+6,0); key = `${y}-H${h+1}`; label = h ? `Jul–Dec ${y}` : `Jan–Jun ${y}`; }
  else if (b.cycle === "anniversary"){
    const od = parse(inst && inst.openedDate);
    if (!od){ assumed = true; start = new Date(y,0,1); end = new Date(y,11,31); key = `${y}`; label = `${y} (estimated)`; }
    else { let s = new Date(y, od.getMonth(), od.getDate()); if (s > t) s = new Date(y-1, od.getMonth(), od.getDate());
      start = s; end = new Date(s.getFullYear()+1, s.getMonth(), s.getDate()-1); key = `A${iso(s)}`; label = `Card year from ${fmtDate(s, true)}`; }
  } else { start = new Date(y,0,1); end = new Date(y,11,31); key = `${y}`; label = `${y}`; }
  const stop = parse(b.endsOn), begin = parse(b.startsOn);
  if (stop && start > stop) return null;
  if (begin && end < begin) return null;
  if (stop && end > stop) end = stop;
  const value = (b.decemberValue && b.frequency === "monthly" && m === 11) ? b.decemberValue : b.value;
  return { key, start, end, label, value, assumed };
}

function itemFor(b, inst, t){
  const p = periodOf(b, inst, t); if (!p) return null;
  const rec = (S.tracking[b.id] || {})[p.key];
  const status = rec ? rec.status : "unused";
  const used = status === "used" ? p.value : status === "partial" ? Math.min(+rec.amount || 0, p.value) : 0;
  const remaining = status === "na" ? 0 : Math.max(0, p.value - used);
  const done = status === "na" || status === "used" || remaining < 0.005;
  return { b, card:cardById(b.cardId), inst, p, status, used, remaining, done, days:daysUntil(p.end, t) };
}
function allItems(t = now()){
  const out = [];
  S.cards.forEach(inst => BENEFITS.filter(b => b.cardId === inst.id).forEach(b => { const it = itemFor(b, inst, t); if (it) out.push(it); }));
  return out;
}
const valuation = id => { const v = S.settings.valuations[id]; return v === undefined ? 100 : v; };

/* Fee recovery: advertised vs redeemed vs what the user says it's worth to them, this calendar year */
function feeStats(cardId, t = now()){
  const card = cardById(cardId), inst = S.cards.find(c => c.id === cardId), yr = t.getFullYear();
  let advertised = 0, potential = 0, redeemed = 0, yours = 0;
  BENEFITS.filter(b => b.cardId === cardId).forEach(b => {
    const p = periodOf(b, inst, t); if (!p) return;
    advertised += b.annualValue; potential += b.annualValue * valuation(b.id)/100;
    Object.entries(S.tracking[b.id] || {}).forEach(([k, r]) => {
      const inYear = k.startsWith("A") ? k === p.key : k.startsWith(String(yr));
      if (!inYear || r.status === "na") return;
      const amt = r.status === "used" ? (+r.value || 0) : Math.min(+r.amount || 0, +r.value || Infinity);
      redeemed += amt; yours += amt * valuation(b.id)/100;
    });
  });
  return { card, fee:card.annualFee, advertised, potential, redeemed, yours, left:Math.max(0, card.annualFee - yours) };
}

function setStatus(b, p, status, amount){
  S.tracking[b.id] = S.tracking[b.id] || {};
  if (status === "unused") delete S.tracking[b.id][p.key];
  else S.tracking[b.id][p.key] = { status, amount: status === "partial" ? Math.max(0, Math.min(+amount || 0, p.value)) : status === "used" ? p.value : 0, value:p.value, end:iso(p.end), label:p.label, at:new Date().toISOString() };
  save();
}

const ruleLive = r => (!r.until || now() <= parse(r.until)) && (!r.from || now() >= parse(r.from));
function bestRule(card, cat, ignoreRotating){
  const cats = cat === "travel" ? ["flights","hotels"] : [cat];
  const inst = S.cards.find(i => i.id === card.id);
  const rules = card.earn.filter(r => cats.includes(r.cat) && ruleLive(r) && !(ignoreRotating && r.rotating) && (!r.choice || !inst || (inst.choice || "gas") === r.choice));
  const anywhere = rules.filter(r => r.how === "any" || r.how === "direct").sort((a,b)=>b.mult-a.mult)[0];
  let portal = rules.filter(r => r.how === "portal" || r.how === "partner").sort((a,b)=>b.mult-a.mult)[0];
  if (["flights","hotels","car_rental","travel"].includes(cat)){ const p = card.earn.find(r => r.cat === "portal"); if (p && (!portal || p.mult > portal.mult)) portal = p; }
  const base = { mult:card.base, how:"any", text: card.baseText || "on other purchases", isBase:true };
  return { main: anywhere && anywhere.mult >= card.base ? anywhere : base, portal: portal && portal.mult > (anywhere ? anywhere.mult : card.base) ? portal : null };
}
const xr = (m, c) => c && c.cash ? `${m}%` : `${m}x`;
const unit = c => c && c.cash ? "cash back" : "points";
const cents = (mult, card) => (mult * PV(card.program)).toFixed(1).replace(/\.0$/,"");

function walletCards(){ return S.cards.map(i => cardById(i.id)); }
function namedCards(q){
  const hits = [];
  CARDS.forEach(c => c.aliases.forEach(a => { if (a.length > 3 && new RegExp(`\\b${a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}\\b`).test(q)) hits.push({ id:c.id, a }); }));
  const keep = hits.filter(h => !hits.some(o => o.id !== h.id && o.a.length > h.a.length && o.a.includes(h.a)));
  return [...new Set(keep.map(h => h.id))];
}

function categoryAnswer(cat, q, restrictTo){
  let cards = walletCards();
  const notOwned = (restrictTo||[]).filter(id => !S.cards.some(c => c.id === id));
  if (restrictTo && restrictTo.length) cards = cards.filter(c => restrictTo.includes(c.id));
  if (!cards.length) cards = walletCards();
  const travelBoost = c => cat === "travel" ? (c.rental.level === "primary" ? 1.5 : 0) + (c.perks.some(p => /lounge|priority pass/i.test(p.name + p.text)) ? 0.5 : 0) + (c.network === "Discover" || c.id === "active-cash" ? -2 : 0) : 0;
  const score = x => x.r.main.mult * PV(x.c.program) + travelBoost(x.c);
  const ranked = cards.map(c => ({ c, r:bestRule(c, cat) })).sort((a,b) => score(b) - score(a) || b.r.main.mult - a.r.main.mult);
  const top = ranked[0], label = CATS[cat].label;
  const A = { q, pick:top.c.id, title:`Use ${top.c.name}`, why:[], watch:[], alts:[], credits:[], sources:[top.c.source] };
  A.why.push(`Earns ${xr(top.r.main.mult, top.c)} ${top.c.programName} ${top.r.main.text}${top.r.main.cap ? ` (${top.r.main.cap})` : ""}.`);
  A.short = `${xr(top.r.main.mult, top.c)} ${unit(top.c)} ${top.r.main.text}.`;
  A.cta = { label:`See ${top.c.name} benefits`, tab:"benefits", card:top.c.id };
  A.why.push("That's how many points you earn. What they're worth depends on how you redeem them.");
  if (top.r.main.isBase) A.watch.push(`None of your cards has a bonus category for ${label} that applies everywhere, so this is just the best everyday rate.`);
  ranked.forEach(({c, r}) => {
    if (r.portal) A.alts.push({ card:c, text:`${xr(r.portal.mult, c)} ${r.portal.text}`, note:r.portal.how === "partner" ? "only at participating spots" : "book through the issuer's travel site; prices can differ" });
    if (c !== top.c) A.alts.push({ card:c, text:`${xr(r.main.mult, c)} ${r.main.text}` });
  });
  if (cat === "groceries" && top.c.id === "amex-gold") A.watch.push("Amex's supermarket category usually excludes superstores and warehouse clubs (Walmart, Target, Costco). Check your Card terms.");
  if (["flights","hotels","car_rental","travel"].includes(cat) && S.cards.some(c => c.id === "csr")) A.watch.push(cardById("csr").travelCreditNote);
  if (cat === "flights"){
    const prot = cards.map(c => ({ "amex-plat":"Platinum: trip delay up to $500 after 6 hours", "csr":"Sapphire Reserve: trip delay up to $500 after 6 hours, plus cancellation up to $10,000/person", "amex-gold":"Gold: trip delay up to $300 after 12 hours", "bilt-palladium":"Bilt Palladium: Mastercard travel protections (see Guide to Benefits)" }[c.id])).filter(Boolean);
    if (prot.length > 1) A.watch.push("Trip protections only apply when you pay with that card. " + prot.join(". ") + ".");
  }
  if (cat === "rent" && !cards.some(c => c.id === "bilt-palladium")) A.watch.push("Most cards charge a fee or earn nothing on rent. None of your cards has a rent category.");
  notOwned.forEach(id => A.watch.push(`${cardById(id).name} isn't in your wallet, so I left it out.`));

function expiringAnswer(q, only){
  const t = now(); let cutoff = null, scope = "";
  const mm = MONTHS.findIndex(m => new RegExp(`before ${m.toLowerCase()}|by ${m.toLowerCase()}`).test(q));
  if (mm >= 0){ let y = t.getFullYear(); if (mm <= t.getMonth()) y++; cutoff = new Date(y, mm, 1); scope = `before ${MONTHS[mm]} 1`; }
  else if (/this month|month/.test(q)){ cutoff = new Date(t.getFullYear(), t.getMonth()+1, 1); scope = `by ${fmtDate(new Date(cutoff - DAY))}`; }
  else if (/this week|week/.test(q)){ cutoff = new Date(+t + 8*DAY); scope = "in the next 7 days"; }
  else { cutoff = new Date(+t + 32*DAY); scope = "in the next month"; }
  const pool = allItems(t).filter(it => !only || only.includes(it.b.cardId));
  const list = pool.filter(it => !it.done && it.p.end < cutoff).sort((a,b) => a.p.end - b.p.end);
  const later = pool.filter(it => !it.done && it.p.end >= cutoff);
  const total = list.reduce((s,it) => s + it.remaining, 0);

  A.credits = [];

}

function quickRow(it){
  const sub = it.status === "partial" ? `${money(it.used)} of ${money(it.p.value)} used` : it.status === "used" ? "Used" : it.status === "na" ? "Not for me" : money(it.p.value);

  return `<div class="item">
    <button class="check-btn" data-act="quick" data-id="${it.b.id}" aria-label="${it.status==="used" ? "Mark not used" : "Mark used"}: ${esc(it.b.name)}">${glyph}</button>
    <button class="item-main" data-act="open-benefit" data-id="${it.b.id}">

function trackableIds(t){ return S.cards.filter(i => BENEFITS.some(b => b.cardId === i.id && itemFor(b, i, t))).map(i => i.id); }
function renderTracker(){
  const t = now(), ids = trackableIds(t);
  if (!ids.length) return `${header()}
  <section class="stack-lg" style="margin-top:14px">

  </section>`;
  const toggle = cardToggle(ids);
  const c = cardById(ui.card), inst = S.cards.find(i => i.id === ui.card);
  const items = BENEFITS.filter(b => b.cardId === c.id).map(b => itemFor(b, inst, t)).filter(Boolean);
  const win = Math.max(S.settings.reminderDays, 3);
  const open = items.filter(it => !it.done), done = items.filter(it => it.done);
  const soon = open.filter(it => it.days <= win).sort((a,b) => a.days - b.days);
  const rest = open.filter(it => it.days > win);
  const by = f => rest.filter(it => it.b.frequency === f).sort((a,b) => a.p.end - b.p.end);
  const counted = items.filter(it => it.status !== "na");
  const possible = counted.reduce((s,it) => s + it.p.value, 0), used = counted.reduce((s,it) => s + it.used, 0);
  const left = open.reduce((s,it) => s + it.remaining, 0);
  const tot = list => { const l = list.filter(it => it.status !== "na"); return `${money(l.reduce((s,it) => s + it.used, 0))} / ${money(l.reduce((s,it) => s + it.p.value, 0))}`; };
  const allBy = f => items.filter(it => it.b.frequency === f);
  const sec = (title, list, freq) => list.length ? `<section><div class="sec-row"><h2 class="sec">${title}</h2><span class="sec-tot num">${tot(freq ? allBy(freq) : list)}</span></div><div class="list">${list.map(quickRow).join("")}</div></section>` : "";
  if (!items.length) return `${header()}

  </section>`;
  return `${header()}

    <div class="stack" style="gap:12px"><h1 class="h1">Tracker</h1>${toggle}</div>
    <div class="summary">
      <p class="lede num">${open.length ? `<b>${money(left)}</b> left to use` : `<b>All caught up</b>`}</p>
      <p class="small muted num" style="margin:0">${money(used)} used of ${money(possible)} available this period</p>
      <div class="meter" style="height:8px"><i style="width:${possible ? Math.round(used/possible*100) : 0}%"></i></div>
    </div>
    ${sec("Ending soon", soon)}
    ${sec(`This month`, by("monthly"), "monthly")}
    ${sec(`This quarter`, by("quarterly"), "quarterly")}
    ${sec(`This half-year`, by("semiannual"), "semiannual")}
    ${sec(`This year`, by("annual"), "annual")}
    ${done.length ? `<details class="done-d" id="done-d" ${ui.doneClosed ? "" : "open"}><summary>Done (${done.length}) ${IC.chev}</summary><div class="list" style="margin-top:10px">${done.map(quickRow).join("")}</div></details>` : ""}
    <p class="small muted" style="text-align:center;margin:0">Tap the circle to check off a credit. Tap the name to see more.</p>
  </section>`;
}

/* ---- Benefits (card overview) */
function nextRenewal(inst, t){
  const od = parse(inst.openedDate); if (!od) return null;
  let r = new Date(t.getFullYear(), od.getMonth(), od.getDate()); if (r < t) r = new Date(t.getFullYear()+1, od.getMonth(), od.getDate());
  return r;
}
function savedThisYear(cardId, t){ return feeStats(cardId, t).redeemed; }
function stillAvailable(cardId, t){
  const inst = S.cards.find(i => i.id === cardId); let total = 0;
  BENEFITS.filter(b => b.cardId === cardId).forEach(b => {
    const it = itemFor(b, inst, t); if (!it) return;
    total += it.remaining; const seen = new Set([it.p.key]);
    for (let m = t.getMonth()+1; m < 12 && b.cycle !== "anniversary"; m++){
      const p = periodOf(b, inst, new Date(t.getFullYear(), m, 1));
      if (p && !seen.has(p.key)){ seen.add(p.key); const r = (S.tracking[b.id]||{})[p.key]; total += r && r.status === "na" ? 0 : p.value; }
    }
  });
  return total;
}

      <div class="fact"><span>Annual fee</span><b class="num">${c.annualFee ? money(c.annualFee) : "None"}</b>${c.feeNote ? `<span>${esc(c.feeNote)}</span>` : ""}</div>

    </div>

function rankGoal(g){ const G = GOALS[g] || GOALS.everyday; return G.list.map(([id, why]) => ({ c:cardById(id), why, owned:S.cards.some(i => i.id === id) })).filter(x => x.c && !x.c.closed); }

/* ---- Card finder: turns a typed request into a ranked pick ---- */
function cardFeatures(c){
  const credits = BENEFITS.filter(b => b.cardId === c.id && !b.startsOn && b.type !== "points").reduce((s,b) => s + b.annualValue, 0);
  const creditCount = BENEFITS.filter(b => b.cardId === c.id && !b.startsOn).length;
  const m = cat => bestRule(c, cat, true).main.mult;
  return { c, fee:c.annualFee, base:c.baseEffective || c.base, credits, creditCount, m,
    lounge:c.perks.some(p => /lounge|priority pass/i.test(p.name + " " + p.text)),
    primary:c.rental.level === "primary", noFX:!c.fxFee && c.network !== "Discover",
    travel:Math.max(m("flights"), m("hotels")) };
}
const rate = (f, mult) => `${xr(mult, f.c)}${f.c.cash ? "" : " points"}`;
const INTENTS = [
  { id:"simple", label:"simple, all-around", re:/(simple|all.?around|all.?purpose|coupon|no tracking|track|set it and forget|easy|flat|everything|everyday|one card|low.?maintenance|hassle|straightforward)/,
    score:f => f.base*3 - f.creditCount*0.5 - f.fee/200, why:f => `${rate(f, f.c.base)} on ${f.c.baseEffective ? "everything with Apple Pay" : "everything"}, so there's nothing to track` },
  { id:"value", label:"most value from benefits", re:/(most value|benefits|perks|credits|luxury|premium|best value|get the most|worth|lifestyle)/,
    score:f => (f.credits - f.fee)/250 + (f.lounge ? 1.5 : 0) + f.base*0.4, why:f => f.credits ? `Up to ${money(f.credits)} a year in credits for a ${f.fee ? money(f.fee) : "$0"} fee` : `${rate(f, f.base)} on everything` },

  { id:"nofee", label:"no annual fee", re:/(no (annual )?fee|free card|cheap|student|first card|first credit|beginner|starter|build(ing)? credit|college|broke|low fee|young|teen)/,
    score:f => f.fee === 0 ? 3 + f.base*0.5 : -f.fee/80, why:f => f.fee ? `${money(f.fee)} annual fee` : `No annual fee, and ${rate(f, f.c.base)} on everyday purchases` },

const ISSUERS = [["chase",/chase/],["american express",/amex|american express/],["capital one",/capital one/],["bank of america",/bank of america|bofa/],["citi",/\bciti\b/],["wells fargo",/wells/],["discover",/discover/],["apple",/apple card/],["robinhood",/robinhood/],["bilt",/bilt/]];

function matchCards(text, opts = {}){
  const q = String(text || "").toLowerCase();
  let intents = INTENTS.filter(i => i.re.test(q));
  if (/coupon|not a lot of credits|no credits|don'?t want to track/.test(q)) intents = intents.filter(i => i.id !== "value");
  const issuer = ISSUERS.filter(([,re]) => re.test(q)).map(([n]) => n);
  const generic = !intents.length;
  if (generic) intents = INTENTS.filter(i => i.id === "simple" || i.id === "value");
  const avoidFee = /no (annual )?fee|free card|cheap|student|first card|broke|beginner|starter|college/.test(q);
  const owned = new Set(S.cards.map(i => i.id));
  const scored = CARDS.filter(c => !c.closed).map(c => {
    const f = cardFeatures(c);
    let s = 0; const parts = intents.map(i => { const v = i.score(f); s += v; return { i, v }; });
    if (issuer.length) s += issuer.includes(c.issuer.toLowerCase()) ? 4 : -1;
    if (avoidFee && c.annualFee > 0) s -= 4;
    return { c, f, s, parts, owned:owned.has(c.id) };
  }).sort((a,b) => b.s - a.s);
  const pool = scored.filter(x => !x.owned);
  const top = pool[0] || scored[0];
  const alt = pool.find(x => x !== top && (x.c.issuer !== top.c.issuer || x.c.annualFee !== top.c.annualFee));
  const reasons = top ? top.parts.sort((a,b) => b.v - a.v).slice(0, 3).map(p => p.i.why(top.f)).filter((v,i,a) => v && a.indexOf(v) === i) : [];
  return { intents, generic, issuer, top, alt, reasons, others:pool.filter(x => x !== top && x !== alt).slice(0, 4), ownedBest:scored[0] && scored[0].owned ? scored[0] : null };
}

/* One-line comparison of an alternative against the top pick. */
function compareCards(alt, top){
  const a = cardFeatures(alt), t = cardFeatures(top), bits = [], gives = [];
  if (a.base !== t.base) bits.push(`earns ${rate(a, alt.base)} instead of ${rate(t, top.base)} on everyday purchases`);
  if (a.fee !== t.fee) bits.push(a.fee ? `costs ${money(a.fee)} a year${t.fee ? ` instead of ${money(t.fee)}` : ""}` : "has no annual fee");
  if (a.lounge && !t.lounge) gives.push("airport lounges");
  if (alt.id === "bilt-palladium" && top.id !== "bilt-palladium") gives.push("points on rent");
  if (a.credits > t.credits + 50) gives.push(`up to ${money(a.credits)} a year in credits`);
  if (a.primary && !t.primary) gives.push("primary rental car coverage");
  if (a.noFX && !t.noFX) gives.push("no foreign transaction fees");
  let s = `${alt.name} ${bits.join(" and ")}`.trim();
  if (gives.length) s += `${bits.length ? ", but adds " : " adds "}${gives.join(", ")}`;
  const need = !alt.feeNote && top.feeNote ? `doesn't need ${top.feeNote.replace(/^needs /, "").replace(/^(?!a )/, "a ")}` : "";
  if (need) s += s === alt.name ? ` ${need}` : `, and ${need}`;
  if (s === alt.name){
    const plus = [a.noFX ? "no foreign transaction fees" : null, a.fee ? null : "no annual fee", alt.caveats ? null : null].filter(Boolean);
    s = `${alt.name} is a close second: ${rate(a, a.base)} ${alt.baseText ? alt.baseText.replace(/^points /, "") : "on everything"}${plus.length ? `, ${plus.join(", ")}` : ""}`;
  }
  return s + ".";
}

function render(){
  const y = window.scrollY, app = $("#app");
  if (ui.tab === "explore") app.innerHTML = renderExplore();
  else if (!S.cards.length) app.innerHTML = renderOnboarding();
  else app.innerHTML = ({ tracker:renderTracker, benefits:renderBenefits, settings:renderSettings }[ui.tab] || renderHome)();
  renderTabbar();
  if (ui.tab === "benefits" && S.cards.length){ const car = $("#carousel"), sel = car && car.querySelector(".sel"); if (sel){ ui.quietUntil = Date.now() + 400; car.scrollLeft = sel.offsetLeft - (car.clientWidth - sel.clientWidth)/2; } bindCarousel(); }
  const on = document.querySelector(".toggle .tg.on"); if (on){ const t = on.parentElement; if (on.offsetLeft + on.offsetWidth > t.scrollLeft + t.clientWidth || on.offsetLeft < t.scrollLeft) t.scrollLeft = on.offsetLeft - 20; }
  window.scrollTo(0, ui.keepScroll === false ? 0 : y); ui.keepScroll = true;
}
function bindCarousel(){
  const car = $("#carousel"); if (!car) return; let to;
  car.addEventListener("scroll", () => { clearTimeout(to); to = setTimeout(() => {
    if (!car.isConnected || ui.tab !== "benefits" || Date.now() < (ui.quietUntil || 0) || ui.sheet) return;
    const mid = car.scrollLeft + car.clientWidth/2; let best = null, bd = 1e9;
    car.querySelectorAll(".ccard[data-id]").forEach(el => { const d = Math.abs(el.offsetLeft + el.clientWidth/2 - mid); if (d < bd){ bd = d; best = el; } });
    if (best && best.dataset.id !== ui.card){ ui.card = best.dataset.id; render(); }
  }, 140); }, { passive:true });
}
function toast(msg){ const r = $("#toast-root"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2200); }
function confetti(){ return; }
function confettiOld(x, y){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["var(--accent)","var(--ink)","#E9B44C","var(--good)"];
  for (let i = 0; i < 16; i++){ const s = document.createElement("span"); s.className = "confetti"; const a = Math.random()*Math.PI*2, d = 50 + Math.random()*70;
    s.style.cssText = `left:${x}px;top:${y}px;background:${colors[i%4]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d - 30}px;--rot:${Math.random()*540}deg`; document.body.appendChild(s); setTimeout(() => s.remove(), 950); }
}

    if (!(num(fd.get("required")) > 0)){ toast("Enter your spend goal"); return; }
    inst.bonus = { deadline:fd.get("deadline"), required:num(fd.get("required")), spent:num(fd.get("spent")) || 0, desc:String(fd.get("desc")||"").slice(0,80) };
    save(); closeSheet(); render(); toast("Signup bonus saved"); return;
  }
  if (k === "bonus-add"){
    const inst = S.cards.find(i => i.id === id), v = num(fd.get("amt"));
    if (!(v > 0)){ toast("Enter a purchase amount"); return; }
    inst.bonus.spent = Math.round((+inst.bonus.spent + v)*100)/100; save(); render();
    if (inst.bonus.spent >= inst.bonus.required){ confetti(innerWidth/2, innerHeight/2); toast("Spending goal met"); } else toast(`${money(inst.bonus.required - inst.bonus.spent)} to go`);
    return;
  }
  if (k === "opened"){ S.cards.find(i => i.id === id).openedDate = fd.get("d") || ""; save(); closeSheet(); render(); toast("Saved"); return; }
  if (k === "dates"){ ui.sheet.ids.forEach(cid => { const v = fd.get(cid); if (v) S.cards.find(i => i.id === cid).openedDate = v; }); save(); closeSheet(); render(); toast("Wallet ready. Ask me anything."); return; }
  if (k === "import"){
    try { const s = JSON.parse(fd.get("t")); if (!s || s.v !== 1 || !Array.isArray(s.cards)) throw 0;
      s.cards = s.cards.filter(c => cardById(c.id)); S = Object.assign(defaultState(), s); save(); closeSheet(); ui.tab = "home"; render(); toast("Backup restored"); }
    catch(err){ ui.sheet.error = "That doesn't look like a vault backup."; renderSheet(); }
  }
});

function runAsk(q){
  q = String(q || "").trim(); if (!q) return;
  ui.lastQ = q; ui.answer = ask(q); render();
  const a = $("#answer-card"); if (a){ a.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"nearest" }); a.focus({ preventScroll:true }); }
}

render();

</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
